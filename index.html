<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b3a53">
<title>Ask Atlantic · Atlantic Coast Tours</title>
<style>
  :root {
    --ocean: #0b3a53;
    --ocean-2: #0f4c6b;
    --sea: #1f8a84;
    --foam: #e8f4f2;
    --sand: #f6efe4;
    --ink: #13242e;
    --muted: #5d7380;
    --bot: #ffffff;
    --user: #1f8a84;
    --err-bg: #fdecec;
    --err-ink: #9b1c1c;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--sand);
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 720px;
    height: 100svh;
    display: flex;
    flex-direction: column;
    background: var(--sand);
  }
  @media (min-width: 760px) {
    body { background: linear-gradient(160deg, #dfeeed 0%, var(--sand) 60%); align-items: center; }
    .app {
      height: min(92svh, 860px);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 30px 70px rgba(11, 58, 83, .22);
    }
  }

  /* ---------- Header ---------- */
  header {
    position: relative;
    background: linear-gradient(135deg, var(--ocean) 0%, var(--ocean-2) 60%, var(--sea) 100%);
    color: #fff;
    padding: calc(16px + env(safe-area-inset-top)) 18px 30px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .logo {
    width: 44px; height: 44px; border-radius: 14px;
    background: rgba(255,255,255,.14);
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .logo svg { width: 26px; height: 26px; }
  header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; }
  header p { font-size: .8rem; opacity: .8; margin-top: 2px; }
  .live {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: .72rem; font-weight: 600; letter-spacing: .04em;
    padding: 5px 10px; border-radius: 999px;
    background: rgba(255,255,255,.14);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .live::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: #7cf0c9; box-shadow: 0 0 8px #7cf0c9;
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity: .35; } }

  /* Wave edge under the header */
  .wave {
    position: absolute; left: 0; right: 0; bottom: -1px;
    height: 18px; width: 100%;
  }

  /* ---------- Messages ---------- */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .row { display: flex; flex-direction: column; max-width: 86%; animation: pop .25s ease-out both; }
  .row.bot { align-self: flex-start; }
  .row.user { align-self: flex-end; align-items: flex-end; }
  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  .bubble {
    padding: 11px 15px;
    border-radius: var(--radius);
    font-size: .96rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bot .bubble {
    background: var(--bot);
    border-bottom-left-radius: 6px;
    box-shadow: 0 2px 8px rgba(11, 58, 83, .08);
  }
  .user .bubble {
    background: var(--user);
    color: #fff;
    border-bottom-right-radius: 6px;
  }
  .error .bubble {
    background: var(--err-bg);
    color: var(--err-ink);
    border: 1px solid #f5c2c2;
  }
  .meta {
    font-size: .72rem;
    color: var(--muted);
    margin: 5px 6px 0;
  }

  .thinking .bubble { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
  .dots { display: inline-flex; gap: 4px; }
  .dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--sea);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: .15s; }
  .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: .4; }
    40%           { transform: translateY(-5px); opacity: 1; }
  }

  /* Suggestion chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
  .chip {
    font: inherit; font-size: .82rem;
    padding: 7px 12px; border-radius: 999px;
    border: 1px solid rgba(31, 138, 132, .35);
    background: var(--foam); color: var(--ocean);
    cursor: pointer;
  }
  .chip:hover { background: #d6ecea; }

  /* ---------- Composer ---------- */
  form {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    background: rgba(246, 239, 228, .95);
    border-top: 1px solid rgba(11, 58, 83, .08);
  }
  input {
    flex: 1;
    min-width: 0;
    font: inherit; font-size: 1rem;
    padding: 13px 16px;
    border-radius: 999px;
    border: 1px solid rgba(11, 58, 83, .18);
    background: #fff;
    color: var(--ink);
    outline: none;
  }
  input:focus { border-color: var(--sea); box-shadow: 0 0 0 3px rgba(31, 138, 132, .18); }
  button[type="submit"] {
    font: inherit; font-weight: 600; font-size: .95rem;
    padding: 0 20px;
    border: 0; border-radius: 999px;
    background: var(--ocean);
    color: #fff;
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  button[type="submit"]:hover { background: var(--ocean-2); }
  button[type="submit"]:active { transform: scale(.97); }
  button:disabled, input:disabled { opacity: .55; cursor: not-allowed; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 16c2 0 2-1.5 4-1.5S8 16 10 16s2-1.5 4-1.5S16 16 18 16s2-1.5 4-1.5"/>
          <path d="M2 20c2 0 2-1.5 4-1.5S8 20 10 20s2-1.5 4-1.5S16 20 18 20s2-1.5 4-1.5"/>
          <path d="M12 3v8M9 6l3-3 3 3"/>
        </svg>
      </div>
      <div>
        <h1>Ask Atlantic</h1>
        <p>Atlantic Coast Tours · West of Ireland</p>
      </div>
      <span class="live">LIVE DATA</span>
      <svg class="wave" viewBox="0 0 1200 40" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 20 C150 40 300 0 450 18 S750 40 900 18 S1100 0 1200 20 V40 H0 Z" fill="#f6efe4"/>
      </svg>
    </header>

    <main id="chat" aria-live="polite"></main>

    <form id="composer" autocomplete="off">
      <input id="question" type="text" placeholder="Ask about tours, prices or availability…" aria-label="Your question" required>
      <button id="send" type="submit">Send</button>
    </form>
  </div>

<script>
  const CSV_URL  = "https://docs.google.com/spreadsheets/d/1balBGf8QhZ5dc-RCCAPt2kcrcf6m_YRh0HL_r8bBtJw/export?format=csv";
  const CHAT_URL = "https://luas-class.kluxy.app/chat";
  const SYSTEM = "You are Ask Atlantic, the customer assistant for Atlantic Coast Tours. Answer only from the live data you are given. Quote exact prices in euro and slots left. If something is not in the data, say so. If a value looks implausible, say so and suggest the customer checks with staff. Be warm and brief.";

  const chat  = document.getElementById("chat");
  const form  = document.getElementById("composer");
  const input = document.getElementById("question");
  const send  = document.getElementById("send");

  // Build a message row. Text is set with textContent so replies can never inject HTML.
  function addMessage(role, text, metaText, extraClass) {
    const row = document.createElement("div");
    row.className = "row " + role + (extraClass ? " " + extraClass : "");
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    if (metaText) {
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = metaText;
      row.appendChild(meta);
    }
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }

  function addThinking() {
    const row = document.createElement("div");
    row.className = "row bot thinking";
    row.innerHTML = '<div class="bubble"><span class="dots"><span></span><span></span><span></span></span>Thinking...</div>';
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }

  function timeNow() {
    const d = new Date();
    return [d.getHours(), d.getMinutes(), d.getSeconds()]
      .map(n => String(n).padStart(2, "0")).join(":");
  }

  function setBusy(busy) {
    input.disabled = busy;
    send.disabled = busy;
    if (!busy) input.focus();
  }

  async function ask(question) {
    addMessage("user", question);
    const thinking = addThinking();
    setBusy(true);

    try {
      // 1. Fetch the live tour catalogue on every question
      let csvRes;
      try {
        csvRes = await fetch(CSV_URL, { cache: "no-store" });
      } catch (e) {
        throw new Error("Could not reach the tour catalogue (" + e.message + ").");
      }
      if (!csvRes.ok) throw new Error("Tour catalogue returned HTTP " + csvRes.status + " " + csvRes.statusText);
      const csv = await csvRes.text();
      if (!csv.trim()) throw new Error("The tour catalogue came back empty.");
      const fetchedAt = timeNow();

      // 2. Send question + CSV to the class brain
      let chatRes;
      try {
        chatRes = await fetch(CHAT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system: SYSTEM,
            messages: [{
              role: "user",
              content: "Live data (CSV):\n" + csv + "\n\nCustomer question: " + question
            }]
          })
        });
      } catch (e) {
        throw new Error("Could not reach the assistant (" + e.message + ").");
      }

      const raw = await chatRes.text();
      if (!chatRes.ok) {
        throw new Error("Assistant returned HTTP " + chatRes.status + (raw ? ": " + raw.slice(0, 300) : ""));
      }
      let data;
      try { data = JSON.parse(raw); }
      catch { throw new Error("Assistant sent a response that isn't valid JSON: " + raw.slice(0, 300)); }
      if (typeof data.reply !== "string" || !data.reply.trim()) {
        throw new Error("Assistant response had no \"reply\" field" + (data.error ? ": " + data.error : "."));
      }

      // 3. Show the answer with the fetch time
      thinking.remove();
      addMessage("bot", data.reply.trim(), "Data fetched live at " + fetchedAt);
    } catch (err) {
      thinking.remove();
      addMessage("bot", "Sorry, something went wrong.\n" + (err && err.message ? err.message : String(err)), "Error at " + timeNow(), "error");
    } finally {
      setBusy(false);
    }
  }

  // Send button and Enter key both submit the form
  form.addEventListener("submit", e => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q || send.disabled) return;
    input.value = "";
    ask(q);
  });

  // Welcome message with a few starter questions
  (function welcome() {
    addMessage("bot", "Fáilte! I'm Ask Atlantic. Ask me about our tours, prices and how many places are left. I check the live catalogue every time you ask.");
    const chips = document.createElement("div");
    chips.className = "row bot";
    const wrap = document.createElement("div");
    wrap.className = "chips";
    ["Which tours have slots left?", "What's the cheapest tour?", "What tours do you offer?"].forEach(t => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = t;
      b.addEventListener("click", () => { if (!send.disabled) ask(t); });
      wrap.appendChild(b);
    });
    chips.appendChild(wrap);
    chat.appendChild(chips);
    input.focus();
  })();
</script>
</body>
</html>
